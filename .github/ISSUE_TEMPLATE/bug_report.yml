name: Bug 报告
description: 报告可复现的扩展、扫描或报告问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先脱敏日志与样本，不要提交真实 Token、Cookie、目标信息或未修复漏洞细节。
  - type: input
    id: version
    attributes:
      label: 扩展版本
      placeholder: v0.3.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: VS Code、Node.js、操作系统版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 仅提供最小化、已脱敏且有权测试的样本。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，并确认没有重复报告。
          required: true
        - label: 我已移除凭证、个人数据和未授权目标信息。
          required: true
